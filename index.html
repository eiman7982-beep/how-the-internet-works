<?xml version="1.0" encoding="UTF-8"?>
<svg id="howInternetWorksSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2300 535" width="100%" height="100%" style="max-width: 2300px; height: auto; display: block; margin: 0 auto;">
  <defs>
    <!-- Soft Card Drop Shadows -->
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>

    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Laptop Chassis &amp; Metallic Gradients -->
    <linearGradient id="laptopBaseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B0C2D6" />
      <stop offset="65%" stop-color="#8FA4BC" />
      <stop offset="100%" stop-color="#536880" />
    </linearGradient>

    <linearGradient id="laptopBezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28394D" />
      <stop offset="100%" stop-color="#1A2636" />
    </linearGradient>

    <linearGradient id="screenBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FBFF" />
      <stop offset="100%" stop-color="#EDF4FC" />
    </linearGradient>

    <!-- Send Button Gradient -->
    <linearGradient id="sendBtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E96FF" />
      <stop offset="100%" stop-color="#0B74DA" />
    </linearGradient>

    <!-- Server Firewall Brick &amp; Security Shield Gradients -->
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <linearGradient id="brickAltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Client / Router Firewall Gradients (Teal Theme) -->
    <linearGradient id="routerBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="clientShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="55%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#115E59" />
    </linearGradient>

    <!-- Server Tower Gradients -->
    <linearGradient id="serverTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5D73" />
      <stop offset="100%" stop-color="#354659" />
    </linearGradient>

    <linearGradient id="serverFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B4D63" />
      <stop offset="100%" stop-color="#273547" />
    </linearGradient>

    <linearGradient id="serverSideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263445" />
      <stop offset="100%" stop-color="#192330" />
    </linearGradient>

    <!-- Metallic Gear Gradient -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EAF2" />
      <stop offset="50%" stop-color="#B9C7D6" />
      <stop offset="100%" stop-color="#8FA1B5" />
    </linearGradient>

    <!-- Globe Ocean &amp; Arrow Gradients -->
    <radialGradient id="oceanGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#24A0FF" />
      <stop offset="65%" stop-color="#0A7CE0" />
      <stop offset="100%" stop-color="#0654A3" />
    </radialGradient>

    <linearGradient id="orbitArrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#33A8FF" />
      <stop offset="100%" stop-color="#0A7CE0" />
    </linearGradient>

    <!-- Clip path for URL typing reveal in Step 1 -->
    <clipPath id="urlTypeClip">
      <rect x="66" y="294" width="0" height="34" rx="4">
        <animate attributeName="width" values="0;0;155;155;0" keyTimes="0;0.08;0.42;0.88;1" dur="5.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Clip path for Earth globe continents (Step 5) -->
    <clipPath id="earthClip">
      <circle cx="1482" cy="366" r="73" />
    </clipPath>

    <!-- Embedded CSS Keyframe Animations (100% Self-Contained for Export) -->
    <style>
      .svg-root {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      .card-group {
        cursor: pointer;
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      }

      .card-group:hover .card-body-rect {
        stroke-width: 4.5;
      }

      .card-dimmed {
        opacity: 0.38;
      }

      .card-highlighted {
        opacity: 1;
      }

      /* Connector Flow Line Animations */
      @keyframes dashFlow {
        0% { stroke-dashoffset: 36; }
        100% { stroke-dashoffset: 0; }
      }

      .connector-dash {
        stroke-dasharray: 7 5;
        animation: dashFlow 1.2s linear infinite;
      }

      /* Step 1: Typing Cursor, Action Rays &amp; Pointer */
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes typingCaretMove {
        0%, 8% { transform: translateX(0px); }
        42%, 88% { transform: translateX(146px); }
        100% { transform: translateX(0px); }
      }

      @keyframes rayPulse1 {
        0%, 100% { transform: scaleY(0.85); opacity: 0.65; }
        50% { transform: scaleY(1.15); opacity: 1; }
      }

      @keyframes pointerHover1 {
        0%, 100% { transform: translate(0px, 0px); }
        35% { transform: translate(-8px, -10px); }
        70% { transform: translate(-4px, -6px); }
      }

      .typing-caret {
        animation: cursorBlink 0.75s infinite, typingCaretMove 5.5s ease-in-out infinite;
      }

      .action-ray {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: rayPulse1 1.6s ease-in-out infinite;
      }
      .action-ray-delay-1 { animation-delay: 0.2s; }
      .action-ray-delay-2 { animation-delay: 0.4s; }

      .step1-pointer {
        animation: pointerHover1 4s ease-in-out infinite;
      }

      /* Step 2: Cursor Click &amp; Send Button Press */
      @keyframes clickCursorMotion {
        0%, 15% { transform: translate(16px, 18px) scale(1); }
        38% { transform: translate(0px, 0px) scale(1); }
        46% { transform: translate(-2px, -2px) scale(0.88); }
        56% { transform: translate(0px, 0px) scale(1); }
        82% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(16px, 18px) scale(1); }
      }

      @keyframes sendBtnPress {
        0%, 40% { transform: scale(1); }
        46% { transform: scale(0.93); }
        56%, 100% { transform: scale(1); }
      }

      @keyframes clickBurstPop {
        0%, 42% { opacity: 0; transform: scale(0.5); }
        48% { opacity: 1; transform: scale(1.12); }
        68% { opacity: 1; transform: scale(1); }
        82%, 100% { opacity: 0; transform: scale(0.8); }
      }

      .step2-cursor {
        transform-box: fill-box;
        transform-origin: top left;
        animation: clickCursorMotion 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      .step2-btn {
        transform-box: fill-box;
        transform-origin: center;
        animation: sendBtnPress 3.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      .step2-burst {
        transform-box: fill-box;
        transform-origin: center;
        animation: clickBurstPop 3.2s ease-out infinite;
      }

      /* Step 3 &amp; Step 6: Firewall Scanner Beam, Safe Packet &amp; Blocked Threat */
      @keyframes firewallScanBeam {
        0%, 100% { transform: translateY(-24px); opacity: 0.55; }
        50% { transform: translateY(30px); opacity: 1; }
      }

      @keyframes safePacketPass {
        0% { transform: translateX(-82px) scale(0.85); opacity: 0; }
        20% { transform: translateX(-44px) scale(1); opacity: 1; }
        50% { transform: translateX(0px) scale(1.12); opacity: 1; }
        80% { transform: translateX(62px) scale(1); opacity: 1; }
        100% { transform: translateX(92px) scale(0.85); opacity: 0; }
      }

      @keyframes threatPacketBlock {
        0% { transform: translateX(-82px) scale(0.85); opacity: 0; }
        25% { transform: translateX(-34px) scale(1); opacity: 1; }
        42% { transform: translateX(-18px) scale(1.15); opacity: 1; }
        56% { transform: translate(-44px, 16px) rotate(-25deg) scale(0.9); opacity: 0.85; }
        78%, 100% { transform: translate(-64px, 34px) rotate(-45deg) scale(0.6); opacity: 0; }
      }

      @keyframes shieldPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      @keyframes blockBadgeFlash {
        0%, 36% { opacity: 0; transform: scale(0.6); }
        44%, 64% { opacity: 1; transform: scale(1.08); }
        80%, 100% { opacity: 0; transform: scale(0.8); }
      }

      @keyframes wifiWavePulse {
        0%, 100% { opacity: 0.35; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.05); }
      }

      .firewall-scanner {
        animation: firewallScanBeam 2.4s ease-in-out infinite;
      }

      .safe-packet {
        transform-box: fill-box;
        transform-origin: center;
        animation: safePacketPass 3.4s ease-in-out infinite;
      }

      .threat-packet {
        transform-box: fill-box;
        transform-origin: center;
        animation: threatPacketBlock 3.4s ease-in-out infinite 1.7s;
      }

      .firewall-shield {
        transform-box: fill-box;
        transform-origin: center;
        animation: shieldPulse 2.6s ease-in-out infinite;
      }

      .block-alert-badge {
        transform-box: fill-box;
        transform-origin: center;
        animation: blockBadgeFlash 3.4s ease-out infinite 1.7s;
      }

      .wifi-wave-1 {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: wifiWavePulse 1.8s ease-in-out infinite;
      }

      .wifi-wave-2 {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: wifiWavePulse 1.8s ease-in-out infinite 0.35s;
      }

      /* Step 4: Rotating Cogwheel &amp; Blinking Server LEDs */
      @keyframes spinGear {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes ledBlinkFast {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      @keyframes serverBarScan {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }

      .gear-spinner {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinGear 6s linear infinite;
      }

      .led-1 { animation: ledBlinkFast 0.9s infinite 0.0s; }
      .led-2 { animation: ledBlinkFast 1.1s infinite 0.3s; }
      .led-3 { animation: ledBlinkFast 0.8s infinite 0.6s; }
      .led-4 { animation: ledBlinkFast 1.3s infinite 0.2s; }
      .server-bar { animation: serverBarScan 1.6s ease-in-out infinite; }

      /* Step 5: Earth Drift &amp; Orbiting Response Arrows */
      @keyframes continentsDrift {
        0% { transform: translateX(-18px); }
        50% { transform: translateX(10px); }
        100% { transform: translateX(-18px); }
      }

      @keyframes orbitArrowSweepTop {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(-7px, -4px) rotate(-3deg); }
      }

      @keyframes orbitArrowSweepBottom {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(7px, 4px) rotate(-3deg); }
      }

      .earth-continents {
        animation: continentsDrift 9s ease-in-out infinite;
      }

      .orbit-arrow-top {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbitArrowSweepTop 2.8s ease-in-out infinite;
      }

      .orbit-arrow-bottom {
        transform-box: fill-box;
        transform-origin: center;
        animation: orbitArrowSweepBottom 2.8s ease-in-out infinite;
      }

      /* Step 7: Celebration Rays &amp; Google Logo Pop */
      @keyframes celebrateRays {
        0%, 100% { transform: scale(0.92) translateY(2px); opacity: 0.75; }
        50% { transform: scale(1.12) translateY(-3px); opacity: 1; }
      }

      @keyframes googleLetterBounce {
        0%, 100% { transform: translateY(0px); }
        25% { transform: translateY(-4px); }
        50% { transform: translateY(0px); }
      }

      .celebrate-rays {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: celebrateRays 1.8s ease-in-out infinite;
      }

      .g-letter-1 { animation: googleLetterBounce 2.6s ease-in-out infinite 0.0s; }
      .g-letter-2 { animation: googleLetterBounce 2.6s ease-in-out infinite 0.12s; }
      .g-letter-3 { animation: googleLetterBounce 2.6s ease-in-out infinite 0.24s; }
      .g-letter-4 { animation: googleLetterBounce 2.6s ease-in-out infinite 0.36s; }
      .g-letter-5 { animation: googleLetterBounce 2.6s ease-in-out infinite 0.48s; }
      .g-letter-6 { animation: googleLetterBounce 2.6s ease-in-out infinite 0.60s; }
    </style>
  </defs>

  <!-- Subtle Canvas Background -->
  <rect x="0" y="0" width="2300" height="535" rx="24" fill="#FFFFFF" class="svg-root" />

  <!-- ===================================================================== -->
  <!-- CONNECTING FLOW ARROWS BETWEEN CARDS (1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 7)-->
  <!-- ===================================================================== -->
  <g id="flowConnectors">
    <!-- 1 -> 2 -->
    <line x1="306" y1="285" x2="344" y2="285" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" class="connector-dash" />
    <polygon points="341,278 353,285 341,292" fill="#1884EB" />
    <circle r="4.5" cy="285" fill="#1884EB">
      <animate attributeName="cx" values="306;346" dur="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- 2 -> 3 (Server Firewall &amp; WAF) -->
    <line x1="636" y1="285" x2="674" y2="285" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" class="connector-dash" />
    <polygon points="671,278 683,285 671,292" fill="#169840" />
    <circle r="4.5" cy="285" fill="#169840">
      <animate attributeName="cx" values="636;676" dur="1.4s" begin="0.23s" repeatCount="indefinite" />
    </circle>

    <!-- 3 (Server Firewall) -> 4 (Server) -->
    <line x1="966" y1="285" x2="1004" y2="285" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" class="connector-dash" />
    <polygon points="1001,278 1013,285 1001,292" fill="#DC2626" />
    <circle r="4.5" cy="285" fill="#DC2626">
      <animate attributeName="cx" values="966;1006" dur="1.4s" begin="0.46s" repeatCount="indefinite" />
    </circle>

    <!-- 4 (Server) -> 5 (Response) -->
    <line x1="1296" y1="285" x2="1334" y2="285" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" class="connector-dash" />
    <polygon points="1331,278 1343,285 1331,292" fill="#F5860C" />
    <circle r="4.5" cy="285" fill="#F5860C">
      <animate attributeName="cx" values="1296;1336" dur="1.4s" begin="0.69s" repeatCount="indefinite" />
    </circle>

    <!-- 5 (Response) -> 6 (Client / Network Firewall) -->
    <line x1="1626" y1="285" x2="1664" y2="285" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" class="connector-dash" />
    <polygon points="1661,278 1673,285 1661,292" fill="#6D4BC3" />
    <circle r="4.5" cy="285" fill="#6D4BC3">
      <animate attributeName="cx" values="1626;1666" dur="1.4s" begin="0.92s" repeatCount="indefinite" />
    </circle>

    <!-- 6 (Client Firewall) -> 7 (Website Appears) -->
    <line x1="1956" y1="285" x2="1994" y2="285" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" class="connector-dash" />
    <polygon points="1991,278 2003,285 1991,292" fill="#0D9488" />
    <circle r="4.5" cy="285" fill="#0D9488">
      <animate attributeName="cx" values="1956;1996" dur="1.4s" begin="1.15s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ===================================================================== -->
  <!-- STEP 1: TYPE URL (Blue Theme)                                         -->
  <!-- ===================================================================== -->
  <g id="stepCard1" class="card-group svg-root" data-step="1">
    <!-- Card Body -->
    <rect x="20" y="54" width="286" height="456" rx="28" fill="#D5ECFF" stroke="#4DA6FF" stroke-width="3" filter="url(#cardShadow)" class="card-body-rect" />

    <!-- Top Number Badge -->
    <circle cx="163" cy="54" r="36" fill="#1884EB" filter="url(#badgeShadow)" />
    <text x="163" y="69" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800">1</text>

    <!-- Step Title -->
    <text x="163" y="150" text-anchor="middle" fill="#0B192C" font-size="34" font-weight="800" letter-spacing="-0.5">Type URL</text>

    <!-- Yellow Action Lines Above Laptop -->
    <g>
      <rect x="122" y="196" width="11" height="32" rx="5.5" fill="#FFB800" stroke="#E09600" stroke-width="1.5" transform="rotate(-28 127 212)" class="action-ray" />
      <rect x="157.5" y="186" width="11" height="34" rx="5.5" fill="#FFB800" stroke="#E09600" stroke-width="1.5" class="action-ray action-ray-delay-1" />
      <rect x="193" y="196" width="11" height="32" rx="5.5" fill="#FFB800" stroke="#E09600" stroke-width="1.5" transform="rotate(28 198 212)" class="action-ray action-ray-delay-2" />
    </g>

    <!-- Laptop Illustration -->
    <g>
      <!-- Outer Lid / Bezel -->
      <rect x="46" y="242" width="234" height="156" rx="14" fill="url(#laptopBezelGrad)" stroke="#111C2B" stroke-width="3" />
      <!-- Webcam Dot -->
      <circle cx="163" cy="250" r="2.5" fill="#475B73" />
      <!-- Inner Screen -->
      <rect x="58" y="257" width="210" height="128" rx="6" fill="url(#screenBgGrad)" />

      <!-- Browser Top Toolbar -->
      <path d="M58 263 a6 6 0 0 1 6 -6 h198 a6 6 0 0 1 6 6 v14 H58 Z" fill="#218DF2" />
      <!-- Window Control Dots -->
      <circle cx="69" cy="267" r="3.2" fill="#FF5F56" />
      <circle cx="80" cy="267" r="3.2" fill="#FFBD2E" />
      <circle cx="91" cy="267" r="3.2" fill="#27C93F" />

      <!-- URL Address Bar -->
      <rect x="66" y="290" width="194" height="40" rx="10" fill="#FFFFFF" stroke="#8FB8DE" stroke-width="2.5" />

      <!-- Web Globe Icon Inside Address Bar -->
      <g transform="translate(84, 310)" stroke="#1884EB" stroke-width="1.8" fill="none">
        <circle cx="0" cy="0" r="10.5" />
        <ellipse cx="0" cy="0" rx="4.8" ry="10.5" />
        <line x1="-10.5" y1="0" x2="10.5" y2="0" />
        <path d="M-8.5 -5.5 Q0 -3.5 8.5 -5.5" />
        <path d="M-8.5 5.5 Q0 3.5 8.5 5.5" />
      </g>

      <!-- Animated Typed URL Text -->
      <g clip-path="url(#urlTypeClip)">
        <text x="102" y="316" fill="#0F172A" font-size="16.5" font-weight="700" letter-spacing="-0.2">www.google.com</text>
      </g>

      <!-- Blinking Typing Caret -->
      <rect x="103" y="299" width="2.2" height="22" rx="1" fill="#1884EB" class="typing-caret" />

      <!-- Dark Cursor Arrow -->
      <g class="step1-pointer">
        <path d="M214 334 L214 373 L224 363 L233 379 L240 375 L231 359 L244 359 Z" fill="#13263E" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round" />
      </g>

      <!-- Laptop Keyboard Deck / Base -->
      <path d="M46 398 L280 398 L298 430 L28 430 Z" fill="url(#laptopBaseGrad)" stroke="#16263A" stroke-width="3" stroke-linejoin="round" />
      <!-- Keyboard Recess -->
      <path d="M56 404 L270 404 L277 416 L49 416 Z" fill="#1C2E45" />
      <!-- Trackpad -->
      <rect x="135" y="420" width="56" height="7" rx="3" fill="#4E6682" />
      <!-- Bottom Lip -->
      <path d="M28 430 L298 430 C298 437 291 441 282 441 L44 441 C35 441 28 437 28 430 Z" fill="#3B5370" stroke="#16263A" stroke-width="3" />
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- STEP 2: SEND REQUEST (Green Theme)                                    -->
  <!-- ===================================================================== -->
  <g id="stepCard2" class="card-group svg-root" data-step="2">
    <!-- Card Body -->
    <rect x="350" y="54" width="286" height="456" rx="28" fill="#D5F5CE" stroke="#169840" stroke-width="3" filter="url(#cardShadow)" class="card-body-rect" />

    <!-- Top Number Badge -->
    <circle cx="493" cy="54" r="36" fill="#169840" filter="url(#badgeShadow)" />
    <text x="493" y="69" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="800">2</text>

    <!-- Step Title -->
    <text x="493" y="150" text-anchor="middle" fill="#0B192C" font-size="33" font-weight="800" letter-spacing="-0.5">Send Request</text>

    <!-- Laptop Illustration -->
    <g>
      <!-- Outer Lid / Bezel -->
      <rect x="376" y="232" width="234" height="164" rx="14" fill="url(#laptopBezelGrad)" stroke="#111C2B" stroke-width="3" />
      <!-- Webcam Dot -->
      <circle cx="493" cy="240" r="2.5" fill="#475B73" />
      <!-- Inner Screen -->
      <rect x="388" y="248" width="210" height="134" rx="6" fill="url(#screenBgGrad)" />

      <!-- Interactive Blue "Send" Button -->
      <g class="step2-btn">
        <rect x="418" y="280" width="150" height="62" rx="14" fill="url(#sendBtnGrad)" stroke="#0A64BD" stroke-width="2.5" />
        <text x="493" y="320" text-anchor="middle" fill="#FFFFFF" font-size="27" font-weight="800" letter-spacing="0.2">Send</text>
      </g>
